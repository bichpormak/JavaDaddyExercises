plugins {
    id 'java'
}

group = 'com.bichpormak'
version = 'unspecified'

repositories {
    mavenCentral()
}

dependencies {

    testImplementation 'org.mockito:mockito-junit-jupiter:5.18.0'

    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}